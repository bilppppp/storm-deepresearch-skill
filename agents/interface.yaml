interface:
  display_name: "STORM DeepResearch"
  short_description: "STORM research with evidence and review provenance"
  default_prompt: "Use $storm-deepresearch-skill. Ask research_profile; recommend default_full_dossier. Require academic baseline, provider-native matched resolver responses, and retrieval-audit.jsonl. Continue to local_delivery_ready; stop on missing evidence or review handoff. Launch a separate reviewer and import one outside-run submission; never self-attest provenance."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "agent-skills", "vscode", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    release_policy: "validation-trust-human-approval"
    trust_report_required: true
  degradation:
    openai: "Keep contracts."
    claude: "Keep contracts."
    agent-skills: "Use SKILL.md."
    vscode: "Keep contracts."
    generic: "Require adapter."
contract:
  inputs:
    required: ["topic_or_question", "profile_selection"]
    optional: ["input_files", "urls", "findings_jsonl", "audience", "timeframe", "source_policy", "freshness_policy", "retrieval_mode", "research_profile", "report_language", "length_contract", "storm_lens_mode", "workspace_root", "output_root"]
  defaults:
    research_profile: "default_full_dossier"
    research_profile_options: ["default_full_dossier", "critique_deepresearch", "closed_corpus", "briefing", "repair_existing_run"]
    primary_research_profile_options: ["default_full_dossier", "briefing"]
    legacy_research_profile_aliases: {strict_storm_lens: "default_full_dossier"}
    profile_selection_modes: ["user_selected", "user_requested_default", "defaulted_after_prompt"]
    profile_selection_policy: "init requires mode and evidence"
    retrieval_mode: "host"
    output_mode: "full"
    depth_level: "full_dossier"
    zh_length_contract: "8000-10000 net body characters excluding bibliography/source sections"
    en_length_contract: "3500-7000 net body words excluding bibliography/source sections"
    output_root: "output/storm-deepresearch"
    output_collision_policy: "fail"
    storm_lens_mode: "strict"
    ledger_update_policy: "monotonic-merge"
    state_model: "generation artifacts plus immutable receipt chain"
    research_pool_policy: "tasklets need usable findings before evidence"
    release_policy: "validation-plus-trust-plus-human-approval"
    review_policy: "review-prepare hands one external submission to harness-owned provenance"
    local_delivery_policy: "only status.local_delivery_ready=true may be collected and presented as final"
    current_view_policy: "harness-owned; never write directly"
    absence_claim_policy: "material absence needs multi-surface audit"
    academic_retrieval_policy: "verified baseline plus provider-native resolver snapshots, screening, version families, and gap-fill"
  permissions: ["read approved inputs", "write inside output root", "use approved host network", "run validators"]
  stop_conditions: ["required evidence or provenance missing", "P2 retrieval or P4 repair open", "a gate fails", "release lacks Trust or human approval"]
  non_goals: ["quick lookup", "unsupported role-play", "personalized professional advice"]
