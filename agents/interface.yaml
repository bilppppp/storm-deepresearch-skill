interface:
  display_name: "STORM DeepResearch"
  short_description: "Build governed evidence-grounded research packages with STORM tasklets, findings, and receipt validation"
  default_prompt: "Use $storm-deepresearch-skill for a governed dossier. Stop on missing findings or evidence; release needs receipt chain and human approval."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "agent-skills"
    - "vscode"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    release_policy: "validation-plus-trust-plus-human-approval"
    trust_report_required: true
  degradation:
    openai: "Preserve governed contracts."
    claude: "Preserve governed contracts."
    agent-skills: "Use SKILL.md and relative resources."
    vscode: "Preserve governed contracts."
    generic: "Require adapter or closed corpus."
contract:
  inputs:
    required:
      - "topic_or_question"
    optional:
      - "input_files"
      - "urls"
      - "findings_jsonl"
      - "audience"
      - "timeframe"
      - "source_policy"
      - "freshness_policy"
      - "retrieval_mode"
      - "report_language"
      - "length_contract"
      - "storm_lens_mode"
      - "workspace_root"
      - "output_root"
  defaults:
    retrieval_mode: "host"
    output_mode: "full"
    depth_level: "full_dossier"
    zh_length_contract: "8000-10000 characters"
    en_length_contract: "3500-7000 words"
    output_root: "output/storm-deepresearch"
    output_collision_policy: "fail"
    storm_lens_mode: "advisory"
    ledger_update_policy: "monotonic-merge"
    state_model: "generation artifacts plus immutable receipt chain"
    research_pool_policy: "storm-tasklets require usable findings before evidence"
    release_policy: "validation-plus-trust-plus-human-approval"
  permissions:
    - "read approved inputs"
    - "write inside resolved output root"
    - "use host network only when brief allows"
    - "run local validation and rendering"
  stop_conditions:
    - "scope or permission missing"
    - "source, Claim, citation, review, trust, or approval is missing evidence"
    - "full dossier findings do not cover every STORM tasklet"
    - "retrieval lacks provenance"
    - "material facts unsupported"
    - "formats fail validation"
    - "path exists or escapes output root"
    - "receipt chain fails"
    - "release lacks human approval or trust"
  non_goals:
    - "quick lookup"
    - "unsupported role-play"
    - "personalized professional advice"
