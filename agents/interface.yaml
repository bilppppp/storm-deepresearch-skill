interface:
  display_name: "STORM DeepResearch"
  short_description: "Governed STORM research with evidence ceilings and external review provenance"
  default_prompt: "Use $storm-deepresearch-skill. Ask research_profile when vague; default default_full_dossier. Record profile_selection; stop on missing evidence."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "agent-skills", "vscode", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
    release_policy: "validation-trust-human-approval"
    trust_report_required: true
  degradation:
    openai: "Preserve governed contracts."
    claude: "Preserve governed contracts."
    agent-skills: "Use SKILL.md."
    vscode: "Preserve governed contracts."
    generic: "Require adapter."
contract:
  inputs:
    required: ["topic_or_question", "profile_selection"]
    optional: ["input_files", "urls", "findings_jsonl", "audience", "timeframe", "source_policy", "freshness_policy", "retrieval_mode", "research_profile", "report_language", "length_contract", "storm_lens_mode", "workspace_root", "output_root"]
  defaults:
    research_profile: "default_full_dossier"
    research_profile_options: ["default_full_dossier", "strict_storm_lens", "critique_deepresearch", "closed_corpus", "briefing", "repair_existing_run"]
    profile_selection_modes: ["user_selected", "user_requested_default", "defaulted_after_prompt"]
    profile_selection_policy: "init fails without profile_selection mode and evidence"
    retrieval_mode: "host"
    output_mode: "full"
    depth_level: "full_dossier"
    zh_length_contract: "8000-10000 net body characters excluding bibliography/source sections"
    en_length_contract: "3500-7000 net body words excluding bibliography/source sections"
    output_root: "output/storm-deepresearch"
    output_collision_policy: "fail"
    storm_lens_mode: "strict"
    ledger_update_policy: "monotonic-merge"
    state_model: "generation artifacts plus immutable receipt chain"
    research_pool_policy: "storm-tasklets require usable findings before evidence"
    release_policy: "validation-plus-trust-plus-human-approval"
    review_policy: "full dossiers require frozen candidate plus captured external_model or human provenance"
    absence_claim_policy: "material absence claims require multi-surface search audit"
  permissions: ["read approved inputs", "write inside resolved output root", "use host network when brief allows", "run validation/rendering"]
  stop_conditions: ["scope, permission, evidence, review provenance, or receipt chain missing evidence", "P2 retrieval or P4 repair remains open", "Claim support, absence audit, depth, format, or path gate fails", "release lacks Trust or human approval"]
  non_goals: ["quick lookup", "unsupported role-play", "personalized professional advice"]
